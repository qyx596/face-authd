name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake ninja-build clang libpam0g-dev libkeyutils-dev libssl-dev libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build pinned OpenCV 4.10 (system 4.6 is too old for YuNet 2023)
        run: |
          git init "$RUNNER_TEMP/opencv-src"
          git -C "$RUNNER_TEMP/opencv-src" remote add origin https://github.com/opencv/opencv.git
          git -C "$RUNNER_TEMP/opencv-src" fetch --depth 1 origin 71d3237a093b60a27601c20e9ee6c3e52154e8b1
          git -C "$RUNNER_TEMP/opencv-src" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/opencv-src" -B "$RUNNER_TEMP/opencv-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opencv" \
            -DBUILD_LIST=core,imgproc,objdetect,dnn -DOPENCV_GENERATE_PKGCONFIG=ON \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_OPENCL=OFF -DWITH_IPP=OFF -DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF
          cmake --build "$RUNNER_TEMP/opencv-build" --parallel 2
          cmake --install "$RUNNER_TEMP/opencv-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/opencv/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/opencv/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked
      - name: Check packaging scripts
        run: |
          shellcheck scripts/*.sh packaging/rpm/*.sh
          for script in packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/config; do sh -n "$script"; done
      - name: Native model smoke test
        run: |
          FACE_AUTHD_MODEL_DIR="$RUNNER_TEMP/face-authd-models" cargo run --locked -p face-authd -- fetch-models
          FACE_AUTHD_MODEL_DIR="$RUNNER_TEMP/face-authd-models" cargo test --locked -p face-authd real_models_load_and_blank_frame_has_no_face -- --ignored
